<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dhanvantri Pharmacy project banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="55%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.16"/>
    </pattern>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="600" height="210" fill="url(#bgGrad)"/>
  <rect width="600" height="210" fill="url(#dotGrid)"/>

  <!-- ambient glows -->
  <circle cx="480" cy="40" r="140" fill="url(#glowA)"/>
  <circle cx="90" cy="190" r="150" fill="url(#glowB)"/>

  <!-- icon badge: pharmacy cross -->
  <g filter="url(#softShadow)">
    <rect x="255" y="28" width="90" height="90" rx="22" fill="#ffffff"/>
    <g transform="translate(300,73)">
      <rect x="-9" y="-30" width="18" height="60" rx="6" fill="#E11D48"/>
      <rect x="-30" y="-9" width="60" height="18" rx="6" fill="#E11D48"/>
    </g>
  </g>

  <!-- small check / verified badge, echoing the other cards -->
  <g transform="translate(352,26)">
    <circle r="15" fill="#ffffff"/>
    <path d="M-6,0 L-1.5,5 L7,-6" stroke="#E11D48" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="300" y="150" text-anchor="middle" font-family="'Sora','Poppins',sans-serif" font-size="27" font-weight="700" fill="#ffffff">
    Dhanvantri Pharmacy
  </text>

  <!-- tech stack subtitle -->
  <text x="300" y="176" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.85">
    JAVA &#183; SPRING BOOT &#183; MYSQL &#183; JSP
  </text>
</svg>
